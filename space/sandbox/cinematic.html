<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c12">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:,">
  <title>シネマティック演出サンプル｜森岡薫 3D Sandbox</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #05070b; overflow: hidden; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* 映画的レターボックス。シネマティックの定番演出。 */
    .bar { position: fixed; left: 0; right: 0; height: 9vh; background: #000; z-index: 4; }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; }
    .caption {
      position: fixed; left: 50%; bottom: 11vh; transform: translateX(-50%);
      z-index: 5; color: #fff; font: 600 15px/1.6 system-ui, sans-serif;
      letter-spacing: 0.14em; text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      opacity: 0; transition: opacity 0.5s ease;
      white-space: nowrap;
    }
    .caption.visible { opacity: 1; }
    .slowmo {
      position: fixed; right: 4vw; top: 11.5vh; z-index: 5;
      color: #ffb545; font: 700 12px/1 system-ui, sans-serif; letter-spacing: 0.3em;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .slowmo.visible { opacity: 1; animation: blink 1.1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.35; } }
    .badge {
      position: fixed; left: 4vw; top: 11.5vh; z-index: 5;
      color: rgba(255,255,255,0.75); font: 600 11px/1 system-ui, sans-serif; letter-spacing: 0.24em;
    }
    #fade { position: fixed; inset: 0; background: #000; z-index: 6; pointer-events: none; transition: opacity 0.45s ease; }
    .back {
      position: fixed; right: 4vw; bottom: 11vh; z-index: 7;
      color: rgba(255,255,255,0.6); font: 600 12px/1 system-ui, sans-serif;
      text-decoration: none; letter-spacing: 0.12em;
    }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="シネマティック再生"></canvas>
  <div class="bar top"></div>
  <div class="bar bottom"></div>
  <p class="badge">CINEMATIC SAMPLE · NOT PRODUCTION</p>
  <p id="caption" class="caption"></p>
  <p id="slowmo" class="slowmo">SLOW MOTION ×0.25</p>
  <div id="fade"></div>
  <a class="back" href="./index.html">操作版へ戻る →</a>
  <script type="module" src="./cinematic.js"></script>
</body>
</html>
