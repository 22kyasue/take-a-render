<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c12">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:,">
  <title>モーションギャラリー｜サッカーMoCap素材ビューア</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #090c12; color: #e8ecf4; font: 14px/1.6 system-ui, sans-serif; overflow: hidden; }
    .layout { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
    aside {
      background: #0d1118; border-right: 1px solid #1c2330;
      overflow-y: auto; padding: 14px;
    }
    aside h1 { font-size: 15px; letter-spacing: 0.06em; margin-bottom: 2px; }
    aside .note { font-size: 11px; color: #8892a4; margin-bottom: 12px; }
    .cat { margin: 14px 0 4px; font-size: 11px; letter-spacing: 0.18em; color: #ffb545; text-transform: uppercase; }
    button.clip {
      display: block; width: 100%; text-align: left; padding: 6px 10px; margin: 2px 0;
      background: transparent; border: 1px solid transparent; border-radius: 8px;
      color: #cfd6e4; font: inherit; font-size: 13px; cursor: pointer;
    }
    button.clip:hover { background: #161c28; }
    button.clip.active { background: #1d2534; border-color: #2f3b52; color: #fff; }
    main { position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute; left: 16px; top: 14px; padding: 8px 14px;
      background: rgba(9, 12, 18, 0.78); border: 1px solid #1c2330; border-radius: 10px;
      pointer-events: none;
    }
    .hud strong { display: block; font-size: 15px; }
    .hud span { font-size: 11px; color: #8892a4; }
    .error { position: absolute; inset: auto 16px 16px 16px; color: #ff9a9a; }
  </style>
</head>
<body>
  <div class="layout">
    <aside id="list">
      <h1>サッカーMoCapギャラリー</h1>
      <p class="note">Mixamo Soccer Game Pack ほか 59本｜クリックで再生・ドラッグで回転</p>
    </aside>
    <main>
      <canvas id="stage"></canvas>
      <div class="hud"><strong id="hud-name">読み込み中…</strong><span id="hud-meta"></span></div>
      <p id="error" class="error" hidden></p>
    </main>
  </div>
  <script type="module" src="./motion-gallery.js"></script>
</body>
</html>
